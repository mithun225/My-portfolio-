
<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Student Registration</h1>

    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact</a>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <p>Year:</p>
        <input type="radio" name="year" id="first">
        <label for="first">First Year</label>

        <input type="radio" name="year" id="second">
        <label for="second">Second Year</label>
        <br><br>

        <p>Interests:</p>
        <input type="checkbox" id="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="java">
        <label for="java">Java</label>
        <br><br>

        <label for="event">Choose Event:</label>
        <select id="event" name="event">
            <option>Coding Competition</option>
            <option>Web Design</option>
        </select>
        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" rows="4" cols="25"></textarea>
        <br><br>

        <input type="submit" value="Register">
    </form>
</body>
</html>
